version: '3.8'

services:
  # 1. خدمة قاعدة البيانات المتجهية Qdrant
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: always

  # 2. خدمة الـ Backend الأساسي (FastAPI)
  backend:
    build: .
    container_name: fastapi_backend
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      - qdrant
    restart: always

  # 3. خدمة واجهة المستخدم (Streamlit Frontend)
  frontend:
    build: .
    container_name: streamlit_frontend
    command: streamlit run frontend/app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: always

volumes:
  qdrant_storage: